<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />

<!-- jquery 3.1 -->
<script src="../../jquery31/js/jquery.js"></script>

<!-- accord - мои вспомогательные компоненты, классы, утилиты -->
<link rel="stylesheet" type="text/css" href="../css/accord.css">
<link rel="stylesheet" type="text/css" href="../css/tabbed-panel.css">
<script type="module" src="../js/accord-publish.js"></script>

<link rel="stylesheet" type="text/css" href="../css/demo-base.css">
<script src="../js/demo-base.js"></script>


<script type="module" src="js/accord-popup-demo.js"></script>


</head>

<body class="acc-default-font">

  <div class="basePanel">

    <div class="titlePanel">
  <h3>Создание плавающих панелей.</h3>
    </div>

    <div class="auxPanel">
      <div id="tabbedPanel1">

        <div class="tab-container">
          <button>Описание</button>
          <button>Ключевой код</button>
        </div>

        <div class="tab-content">
          <pre class="acc-desc-panel">
Классы "acc-popup" и "acc-popup-default" позволяют быстро создать всплывающее окно.
</pre>
        </div>

        <div class="tab-content">
          <pre class="acc-code-panel">
  код
</pre>
        </div>

      </div>

      <div class="logPanel gray-border">
        <div id="log1"></div>
      </div>

    </div>


    <!--               button panel                -->

  <div class="acc-button-panel">
    <button id="b1" type="button" class="acc-btn">contentText </button>
    <button id="b2" type="button" class="acc-btn">contentSelector </button>
    <button id="b3" type="button" class="acc-btn">panelSelector </button>
    <button id="b4" type="button" class="acc-btn">panelUrl </button>

    <button id="b10" type="button" class="acc-btn">Скрыть все панели</button>
  </div>

    <!--               work panel                -->

    <div class="workPanel">






  <div class="acc-popup no-select acc-popup-default" style="top: 520px;left: 100px;display: flex;">
      <div class="acc-centered-content">
      тестовый статичный popup, содержащий acc-button-panel.
      <br>Просто пример использования стилей
      </div>
      <input type="text" />
      <button type="button" class="acc-btn acc-btn-icon-text acc-btn-add">button1</button>
  </div>
  
  <div class="acc-desc-panel" id="popupContent3" style="flex-grow: 1;">
    p3 - Панель с сообщением.
    Задана опцией panelSelector.
  </div>


    
    
    </div>



  </div>



  <template id="popupContent2">
    <div class="acc-vert-button-panel">
      <div class="acc-filler-panel acc-centered-content">
        p2 - Панель с кнопками из template. Загружается опцией contentSelector.
        Перетаскивается за текст.
      </div>
    
    
      <button type="button" class="acc-btn acc-btn-icon acc-btn-check"></button>
      <button type="button" class="acc-btn acc-btn-icon acc-btn-add"></button>
    </div>
  
  </template>

</body>
</html>
